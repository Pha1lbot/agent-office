<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office mockup (isometric)</title>
<style>
  :root { --bg: #1d1f2b; --panel: #262938; --text: #e8e9f0; --muted: #9aa0b5; --accent: #7aa2ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #333748; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  header a { color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 280px; gap: 16px; padding: 16px; }
  #scene { height: min(72vh, 680px); border-radius: 12px; overflow: hidden; background: #2a2d3d; }
  canvas { display: block; width: 100%; height: 100%; }
  aside { background: var(--panel); border-radius: 12px; padding: 14px; align-self: start; }
  aside h2 { margin: 0 0 10px; font-size: 15px; }
  .who { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid #333748; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .who b { display: block; }
  .who span { color: var(--muted); font-size: 13px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } #scene { height: 55vh; } }
</style>
</head>
<body>
<header>
  <h1>Agent Office, isometric</h1>
  <p>Mockup with a made-up day. Nothing here is live. Compare with the <a href="office-3d.html">low-poly 3D version</a>.</p>
</header>
<main>
  <div id="scene"><canvas id="c"></canvas></div>
  <aside><h2>Who's doing what</h2><div id="people"></div></aside>
</main>
<script src="office-sim.js"></script>
<script>
const { BOXES, ZONES, GLASS, LABEL, create, W, D } = window.OfficeSim;
const canvas = document.getElementById("c"), g = canvas.getContext("2d");
let k = 26, ox = 0, oy = 0; // pixels per metre, and where the room's back corner sits on screen

function resize() {
  const r = canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  k = Math.min(r.width / (W + D + 2), r.height / ((W + D) / 2 + 4.5));
  ox = r.width / 2 - ((W - D) / 2) * k; oy = (r.height - ((W + D) / 2) * k) / 2 + 2.2 * k;
}
addEventListener("resize", resize); resize();

// World (x, y up, z) to screen.
const P = (x, y, z) => [ox + (x - z) * k, oy + (x + z) * k * 0.5 - y * k * 0.82];
const shade = (c, f) => {
  const r = Math.min(255, ((c >> 16) & 255) * f), gg = Math.min(255, ((c >> 8) & 255) * f), b = Math.min(255, (c & 255) * f);
  return `rgb(${r | 0},${gg | 0},${b | 0})`;
};
function poly(points, fill, stroke) {
  g.beginPath(); points.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
  g.fillStyle = fill; g.fill();
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); }
}
/** A box with its top and two front-facing sides, lit from the top right. */
function cube(x, y, z, w, h, d, colour, edge = true) {
  const s = edge ? "rgba(0,0,0,0.18)" : null;
  poly([P(x, y, z + d), P(x + w, y, z + d), P(x + w, y + h, z + d), P(x, y + h, z + d)], shade(colour, 0.72), s); // front (+z)
  poly([P(x + w, y, z), P(x + w, y, z + d), P(x + w, y + h, z + d), P(x + w, y + h, z)], shade(colour, 0.88), s); // right (+x)
  poly([P(x, y + h, z), P(x + w, y + h, z), P(x + w, y + h, z + d), P(x, y + h, z + d)], shade(colour, 1.08), s); // top
}

// ---------- What gets drawn, nearest last ----------
function itemsFor(b, busy) {
  const out = [];
  const y0 = b.y || 0;
  const add = (depth, draw) => out.push({ depth, draw });
  const depth = b.x + b.w / 2 + b.z + b.d / 2;
  if (b.kind === "desk" || b.kind === "table") {
    add(depth, () => {
      for (const [lx, lz] of [[0.05, 0.05], [b.w - 0.11, 0.05], [0.05, b.d - 0.11], [b.w - 0.11, b.d - 0.11]]) cube(b.x + lx, 0, b.z + lz, 0.06, b.h - 0.06, 0.06, 0x4a4e5c, false);
      cube(b.x, b.h - 0.06, b.z, b.w, 0.06, b.d, b.colour);
    });
    if (b.kind === "desk") add(b.x + b.w / 2 - 0.2 + b.z - 0.5, () => { cube(b.x + b.w / 2 - 0.45, 0, b.z - 0.75, 0.5, 0.45, 0.5, 0x3d4255); cube(b.x + b.w / 2 - 0.45, 0.45, b.z - 0.8, 0.5, 0.55, 0.08, 0x3d4255); });
  } else if (b.kind === "screen") {
    add(depth + 0.3, () => { cube(b.x, y0, b.z, b.w, b.h, b.d, busy ? 0x2c5fbf : b.colour); });
  } else if (b.kind === "plant") {
    add(depth, () => {
      cube(b.x + 0.1, 0, b.z + 0.1, b.w - 0.2, 0.45, b.d - 0.2, 0xc9805a);
      const [cx, cy] = P(b.x + b.w / 2, 0.45 + (b.h - 0.45) / 2, b.z + b.d / 2);
      const r = b.w * 0.55 * k, grad = g.createRadialGradient(cx - r * 0.3, cy - r * 0.4, r * 0.1, cx, cy, r * 1.2);
      grad.addColorStop(0, shade(b.colour, 1.35)); grad.addColorStop(1, shade(b.colour, 0.7));
      g.fillStyle = grad; g.beginPath(); g.ellipse(cx, cy, r, r * 1.15, 0, 0, Math.PI * 2); g.fill();
    });
  } else if (b.kind === "shelf") {
    add(depth, () => {
      cube(b.x, 0, b.z, b.w, b.h, b.d, b.colour);
      const cols = [0xe06c75, 0x7aa2ff, 0xf2b134, 0x4fbf7f, 0xc38bff];
      for (let row = 0; row < 3; row++) for (let i = 0; i < 8; i++) cube(b.x + 0.15 + i * 0.27, 0.3 + row * 0.6, b.z + b.d, 0.2, 0.42, 0.04, cols[(i + row) % 5], false);
    });
  } else if (b.kind === "kiosk") {
    add(depth, () => { cube(b.x + 0.22, 0, b.z + 0.12, 0.25, 1.05, 0.25, 0x3a3f52); cube(b.x, 1.05, b.z, b.w, 0.5, 0.1, 0x5aa0e6); });
  } else if (b.kind === "server") {
    add(depth, () => {
      cube(b.x, 0, b.z, b.w, b.h, b.d, b.colour);
      for (let i = 0; i < 4; i++) { const [x, y] = P(b.x + 0.12 + i * 0.12, 1.15, b.z + b.d); g.fillStyle = i % 2 ? "#4fbf7f" : "#7aa2ff"; g.fillRect(x - 1.5, y - 1.5, 3, 3); }
    });
  } else if (b.kind === "tv") {
    add(depth, () => { cube(b.x - 0.2, 0, b.z, b.w + 0.4, 0.5, 0.45, 0x5a3b22); cube(b.x, y0, b.z, b.w, b.h, b.d, 0x5a49c8); });
  } else if (b.kind === "coffee") {
    add(depth + 0.2, () => { cube(b.x, y0, b.z, b.w, b.h, b.d, b.colour); cube(b.x + 0.18, y0 + 0.02, b.z + b.d, 0.12, 0.12, 0.12, 0xffffff, false); });
  } else {
    add(depth, () => cube(b.x, y0, b.z, b.w, b.h, b.d, b.colour));
  }
  return out;
}

function person(a, t) {
  const sit = a.pose === "sit", lie = a.pose === "lie";
  const bob = a.pose === "walk" ? Math.abs(Math.cos(a.walkPhase)) * 0.05 : 0;
  const base = (sit ? 0.45 : lie ? 0.5 : 0) + bob;
  const [fx, fy] = P(a.x, 0, a.z);
  // Shadow on the floor
  g.fillStyle = "rgba(0,0,0,0.22)"; g.beginPath(); g.ellipse(fx, fy, 0.32 * k, 0.16 * k, 0, 0, Math.PI * 2); g.fill();
  const body = shade(a.body, 1), dark = shade(a.body, 0.7);
  if (lie) {
    const [x, y] = P(a.x, base + 0.2, a.z);
    const grad = g.createLinearGradient(x, y - 0.3 * k, x, y + 0.3 * k); grad.addColorStop(0, shade(a.body, 1.2)); grad.addColorStop(1, dark);
    g.fillStyle = grad; g.beginPath(); g.ellipse(x, y, 0.75 * k, 0.24 * k, 0.46, 0, Math.PI * 2); g.fill();
    head(x - 0.75 * k, y - 0.35 * k, a); return [x, y - 0.8 * k];
  }
  // Legs
  if (!sit) {
    const swing = a.pose === "walk" ? Math.sin(a.walkPhase) * 0.12 * k : 0;
    for (const s of [-1, 1]) {
      const [lx, ly] = P(a.x, 0, a.z);
      g.fillStyle = "#2f3446"; g.beginPath(); g.roundRect(lx + s * 0.09 * k - 0.07 * k + s * swing, ly - 0.62 * 0.82 * k, 0.14 * k, 0.62 * 0.82 * k, 0.05 * k); g.fill();
    }
  } else {
    const [lx, ly] = P(a.x, base, a.z + 0.2);
    g.fillStyle = "#2f3446"; g.beginPath(); g.roundRect(lx - 0.18 * k, ly - 0.1 * k, 0.36 * k, 0.24 * k, 0.06 * k); g.fill();
  }
  // Body
  const [bx, by] = P(a.x, base + (sit ? 0.15 : 0.62), a.z);
  const h = 0.62 * 0.82 * k, w = 0.46 * k;
  const grad = g.createLinearGradient(bx - w / 2, 0, bx + w / 2, 0); grad.addColorStop(0, shade(a.body, 1.15)); grad.addColorStop(1, dark);
  g.fillStyle = grad; g.beginPath(); g.roundRect(bx - w / 2, by - h, w, h, 0.18 * k); g.fill();
  // Arms: typing jiggles, a mug when they have one
  const typing = a.state === "working" && sit;
  for (const s of [-1, 1]) {
    const j = typing ? Math.sin(t * 14 + s) * 0.03 * k : 0;
    g.fillStyle = s < 0 ? shade(a.body, 1.05) : dark;
    g.beginPath(); g.roundRect(bx + s * w / 2 - 0.07 * k, by - h + 0.06 * k + j, 0.14 * k, h * 0.85, 0.07 * k); g.fill();
  }
  if (a.cup) { g.fillStyle = "#fff"; g.fillRect(bx + w / 2 - 0.02 * k, by - h * 0.25, 0.14 * k, 0.16 * k); }
  head(bx, by - h - 0.18 * k, a);
  return [bx, by - h - 0.55 * k];
}
function head(x, y, a) {
  const r = 0.21 * k;
  const grad = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r * 1.1);
  grad.addColorStop(0, shade(a.skin, 1.12)); grad.addColorStop(1, shade(a.skin, 0.8));
  g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = shade(a.hair, 1); g.beginPath(); g.arc(x, y - r * 0.15, r * 1.02, Math.PI * 1.05, Math.PI * 1.95); g.closePath(); g.fill();
  if (a.state === "asleep") { g.fillStyle = "#1d1f2b"; g.fillRect(x - r * 0.5, y + r * 0.1, r * 0.3, 1.5); g.fillRect(x + r * 0.2, y + r * 0.1, r * 0.3, 1.5); }
  else { g.fillStyle = "#1d1f2b"; g.beginPath(); g.arc(x - r * 0.35, y + r * 0.12, 1.8, 0, 7); g.arc(x + r * 0.35, y + r * 0.12, 1.8, 0, 7); g.fill(); }
}
function tag(x, y, a, t) {
  const icon = a.state === "waiting" ? " !" : a.state === "asleep" ? " z Z" : a.state === "coffee" ? " ☕" : "";
  const text = a.name + icon;
  g.font = "600 12px system-ui, sans-serif";
  const w = g.measureText(text).width + 14;
  const lift = a.state === "waiting" ? Math.abs(Math.sin(t * 3)) * 4 : 0;
  g.fillStyle = a.state === "waiting" ? "#f2b134" : "rgba(29,31,43,0.85)";
  g.beginPath(); g.roundRect(x - w / 2, y - 18 - lift, w, 20, 10); g.fill();
  g.fillStyle = a.state === "waiting" ? "#1d1f2b" : "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, x, y - 8 - lift);
}

function room() {
  for (const zn of ZONES) poly([P(zn.x, 0, zn.z), P(zn.x + zn.w, 0, zn.z), P(zn.x + zn.w, 0, zn.z + zn.d), P(zn.x, 0, zn.z + zn.d)], shade(zn.colour, zn.name === "floor" ? 1 : 1.02));
  // Floor edge, so the room sits on a slab
  poly([P(0, 0, D), P(W, 0, D), P(W, -0.3, D), P(0, -0.3, D)], shade(0xc9b79c, 0.6));
  poly([P(W, 0, 0), P(W, 0, D), P(W, -0.3, D), P(W, -0.3, 0)], shade(0xc9b79c, 0.75));
  // Back and left walls
  const WH = 2.8;
  poly([P(0, 0, 0), P(W, 0, 0), P(W, WH, 0), P(0, WH, 0)], "#d9d5e2");
  poly([P(0, 0, 0), P(0, 0, D), P(0, WH, D), P(0, WH, 0)], "#c5c1d0");
  for (const x of [8, 12, 16, 20]) poly([P(x - 1.3, 1.05, 0), P(x + 1.3, 1.05, 0), P(x + 1.3, 2.35, 0), P(x - 1.3, 2.35, 0)], "#bfe0ff");
  poly([P(0, 0.92, 10.2), P(0, 0.92, 15.4), P(0, 1.6, 15.4), P(0, 1.6, 10.2)], "#8fc1b5"); // kitchen splashback
  for (const [text, x, y, z] of [["HAL", 3, 2.5, 0], ["FILES", 18.4, 2.5, 0]]) {
    const [sx, sy] = P(x, y, z); g.font = "700 11px system-ui"; g.fillStyle = "#2b2f40"; g.textAlign = "center"; g.fillText(text, sx, sy);
  }
  const [kx, ky] = P(0, 2.2, 12.8); g.font = "700 11px system-ui"; g.fillStyle = "#2b2f40"; g.textAlign = "center"; g.fillText("KITCHEN", kx, ky);
}

const sim = create();
const list = document.getElementById("people");
let last = performance.now() / 1000, listAt = 0;
function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.05, now - last); last = now;
  sim.step(dt, now);
  const r = canvas.getBoundingClientRect();
  g.clearRect(0, 0, r.width, r.height);
  room();
  const items = [];
  for (const b of BOXES) {
    const busy = b.kind === "screen" && sim.agents.some((a) => a.state === "working" && Math.abs(a.x - (b.x + b.w / 2)) < 1.2 && Math.abs(a.z - b.z) < 2);
    items.push(...itemsFor(b, busy));
  }
  const tags = [];
  const BIG = 1.35; // people drawn a little larger than life, so they read at this size
  for (const a of sim.agents) items.push({ depth: a.x + a.z + (a.pose === "sit" ? -0.2 : 0.15), draw: () => {
    const [fx, fy] = P(a.x, 0, a.z);
    g.save(); g.translate(fx, fy); g.scale(BIG, BIG); g.translate(-fx, -fy);
    const [tx, ty] = person(a, now);
    g.restore();
    tags.push([fx + (tx - fx) * BIG, fy + (ty - fy) * BIG, a]);
  } });
  for (const gl of GLASS) items.push({ depth: gl.x + gl.w / 2 + gl.z + gl.d / 2 + 0.6, draw: () => {
    const along = gl.d > gl.w; // a wall running front to back, or left to right
    const [x1, z1, x2, z2] = along ? [gl.x, gl.z, gl.x, gl.z + gl.d] : [gl.x, gl.z, gl.x + gl.w, gl.z];
    poly([P(x1, 0, z1), P(x2, 0, z2), P(x2, 2.4, z2), P(x1, 2.4, z1)], "rgba(190,225,255,0.22)", "rgba(80,90,120,0.6)");
  } });
  items.sort((p, q) => p.depth - q.depth).forEach((i) => i.draw());
  for (const [x, y, a] of tags) tag(x, y, a, now); // names always on top
  if (now - listAt > 0.5) {
    list.innerHTML = sim.agents.map((a) => `<div class="who"><span class="dot" style="background:#${a.body.toString(16).padStart(6, "0")}"></span><div><b>${a.name}</b><span>${a.role} · ${LABEL[a.state]}</span></div></div>`).join("");
    listAt = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
